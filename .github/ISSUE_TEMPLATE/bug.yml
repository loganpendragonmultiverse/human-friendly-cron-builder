name: Bug report
description: Report a reproducible parser or preview defect
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes: { label: Summary, description: Describe the incorrect behavior. }
    validations: { required: true }
  - type: textarea
    id: reproduce
    attributes: { label: Reproduction, description: Include the expression, time zone, expected result, and actual result. }
    validations: { required: true }
  - type: input
    id: environment
    attributes: { label: Environment, description: Browser and operating system }
    validations: { required: true }
